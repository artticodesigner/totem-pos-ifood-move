<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pós iFood Move — Totem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--ink);
    color: var(--text-on-ink);
    display: flex;
    flex-direction: column;
    padding: clamp(20px, 3vw, 48px);
    gap: clamp(16px, 2.4vw, 32px);
  }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header .eyebrow { color: var(--accent); }
  header h1 {
    font-size: clamp(1.8rem, 3.6vw, 3.1rem);
    line-height: 1.02;
    max-width: 20ch;
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(220px, 30%) 1fr;
    gap: clamp(20px, 3vw, 48px);
    min-height: 0;
  }

  .painel-qr {
    background: var(--ink-2);
    border-radius: 10px;
    padding: clamp(18px, 2.2vw, 32px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
  }
  #qrcode { background: var(--text-on-ink); padding: 12px; border-radius: 6px; line-height: 0; }
  #qrcode img { display: block; }
  .painel-qr .call { font-size: clamp(1rem, 1.6vw, 1.3rem); font-weight: 600; max-width: 22ch; }
  .contador {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    margin-top: 6px;
  }
  .contador .count { font-size: clamp(1.8rem, 3vw, 2.6rem); color: var(--accent); font-weight: 500; }
  .contador .eyebrow { color: var(--text-on-ink-dim); }

  .ranking {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(10px, 1.6vh, 20px);
  }
  .linha {
    display: grid;
    grid-template-columns: minmax(140px, 22%) 1fr auto;
    align-items: center;
    gap: 16px;
  }
  .linha .rotulo {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: clamp(1rem, 1.6vw, 1.4rem);
    color: var(--text-on-ink-dim);
    transition: color .3s ease;
  }
  .linha.lider .rotulo { color: var(--text-on-ink); }
  .trilha {
    height: clamp(20px, 3.4vh, 34px);
    background: var(--line-on-ink);
    border-radius: 4px;
    overflow: hidden;
  }
  .barra {
    height: 100%;
    width: 0%;
    background: var(--text-on-ink-dim);
    border-radius: 4px;
    transition: width .7s cubic-bezier(.2,.8,.2,1), background .3s ease;
  }
  .linha.lider .barra { background: var(--accent); }
  .linha .valor {
    font-family: 'IBM Plex Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: clamp(1rem, 1.6vw, 1.4rem);
    min-width: 2.4em;
    text-align: right;
    color: var(--text-on-ink-dim);
  }
  .linha.lider .valor { color: var(--accent); }

  footer { display: flex; justify-content: space-between; color: var(--text-on-ink-dim); }
</style>
</head>
<body>
  <header>
    <div>
      <span class="eyebrow">Pós iFood Move · 2ª edição</span>
      <h1>O que os gestores aqui estão enfrentando?</h1>
    </div>
  </header>

  <main>
    <div class="painel-qr">
      <span class="eyebrow">Aponte a câmera</span>
      <div id="qrcode"></div>
      <p class="call">Qual é o maior desafio do seu restaurante hoje?</p>
      <div class="contador">
        <span class="count mono" id="total-respostas">0</span>
        <span class="eyebrow">respostas</span>
      </div>
    </div>

    <div class="ranking" id="ranking"></div>
  </main>

  <footer>
    <span class="eyebrow">Tastto</span>
    <span class="eyebrow" id="status-live">conectando…</span>
  </footer>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="categorias.js"></script>
<script src="totem.js"></script>
</body>
</html>
