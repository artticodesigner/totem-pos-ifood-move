<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pós iFood Move — Totem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=5">
<style>
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--ink);
    color: var(--text-on-ink);
    display: flex;
    flex-direction: column;
    padding: clamp(20px, 3vw, 48px);
    gap: clamp(20px, 3vh, 40px);
  }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  header .eyebrow { color: var(--accent); }
  header h1 {
    text-transform: uppercase;
    font-size: clamp(2rem, 4.6vw, 4.1rem);
    line-height: 1.05;
    max-width: 22ch;
    margin-top: 10px;
  }
  .logo {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: clamp(1.2rem, 1.8vw, 1.6rem);
    color: var(--text-on-ink-dim);
    white-space: nowrap;
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(220px, 30%) 1fr;
    gap: clamp(20px, 3vw, 48px);
    min-height: 0;
  }

  .painel-qr {
    background: var(--ink-2);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 20px;
    padding: clamp(18px, 2.2vw, 32px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
  }
  #qrcode { background: var(--text-on-ink); padding: 12px; border-radius: 10px; line-height: 0; }
  #qrcode img { display: block; }
  .contador {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    margin-top: 6px;
  }
  .contador .count { font-size: clamp(1.8rem, 3vw, 2.6rem); color: var(--accent); font-weight: 500; }
  .contador .eyebrow { color: var(--text-on-ink-dim); }

  .coluna-ranking { display: flex; flex-direction: column; gap: clamp(14px, 2vh, 24px); min-height: 0; }
  .status-row { display: flex; justify-content: flex-end; }
  #status-live { display: inline-flex; align-items: center; gap: 6px; }
  #status-live::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-on-ink-dim);
  }
  #status-live.ao-vivo { color: var(--accent); }
  #status-live.ao-vivo::before { background: var(--accent); }

  .ranking {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(10px, 1.6vh, 20px);
  }
  .linha {
    display: grid;
    grid-template-columns: minmax(140px, 22%) 1fr auto;
    align-items: center;
    gap: 16px;
  }
  .linha .rotulo {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    font-size: clamp(1rem, 1.6vw, 1.4rem);
    color: var(--text-on-ink-dim);
    transition: color .3s ease;
  }
  .linha.lider .rotulo { color: var(--text-on-ink); }
  .trilha {
    height: clamp(20px, 3.4vh, 34px);
    background: var(--line-on-ink);
    border-radius: 99px;
    overflow: hidden;
  }
  .barra {
    height: 100%;
    width: 0%;
    background: #453a78;
    border-radius: 99px;
    transition: width .7s cubic-bezier(.2,.8,.2,1), background .3s ease;
  }
  .linha.lider .barra { background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
  .linha .valor {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    font-size: clamp(1rem, 1.6vw, 1.4rem);
    min-width: 1.6em;
    text-align: right;
    color: var(--text-on-ink-dim);
  }
  .linha.lider .valor { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <div>
      <span class="eyebrow">Pós iFood Move · 2ª edição</span>
      <h1>Qual é o maior desafio do seu restaurante hoje?</h1>
    </div>
    <div class="logo">tastto</div>
  </header>

  <main>
    <div class="painel-qr">
      <span class="eyebrow">Aponte a câmera</span>
      <div id="qrcode"></div>
      <div class="contador">
        <span class="count mono" id="total-respostas">0</span>
        <span class="eyebrow">respostas</span>
      </div>
    </div>

    <div class="coluna-ranking">
      <div class="status-row"><span class="eyebrow" id="status-live">conectando…</span></div>
      <div class="ranking" id="ranking"></div>
    </div>
  </main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="categorias.js?v=5"></script>
<script src="totem.js?v=5"></script>
</body>
</html>
